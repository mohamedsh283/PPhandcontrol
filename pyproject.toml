[build-system]
requires = ["setuptools==84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PPhandcontrol"
version = "1.1.1"
description = "Offline thumbs and pointing gestures for Windows presentations and PDFs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Mohamed Sherif"}]
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/mohamedsh283/PPhandcontrol"
Issues = "https://github.com/mohamedsh283/PPhandcontrol/issues"

[tool.setuptools]
packages = ["pphandcontrol"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
