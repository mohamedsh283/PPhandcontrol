<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Thumbs default mode and optional pointing swipes</title><desc id="desc">Thumbs up is Next and thumbs down is Previous. In Point and swipe mode, left is Next and right is Previous. Relax between commands.</desc>
<rect width="1120" height="560" rx="24" fill="#101e30"/>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
<text x="560" y="43" fill="#58e2c2" font-size="20" font-weight="700">DEFAULT MODE: THUMBS</text>
<rect x="30" y="65" width="520" height="210" rx="18" fill="#192d45"/><rect x="570" y="65" width="520" height="210" rx="18" fill="#192d45"/>
<text x="290" y="152" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" font-size="76">👍</text><text x="830" y="152" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" font-size="76">👎</text>
<text x="290" y="204" fill="#eaf3fd" font-size="26" font-weight="700">THUMBS UP → NEXT</text><text x="830" y="204" fill="#eaf3fd" font-size="26" font-weight="700">THUMBS DOWN → PREVIOUS</text>
<text x="560" y="310" fill="#58e2c2" font-size="20" font-weight="700">OPTIONAL MODE: POINT &amp; SWIPE</text>
<rect x="30" y="332" width="520" height="134" rx="18" fill="#192d45"/><rect x="570" y="332" width="520" height="134" rx="18" fill="#192d45"/>
<text x="290" y="385" fill="#eaf3fd" font-size="27" font-weight="700">← LEFT: NEXT</text><text x="830" y="385" fill="#eaf3fd" font-size="27" font-weight="700">RIGHT: PREVIOUS →</text>
<text x="290" y="430" fill="#b3c6db" font-size="17">Index finger extended toward the camera</text><text x="830" y="430" fill="#b3c6db" font-size="17">Other fingers folded · move horizontally</text>
<text x="560" y="510" fill="#eaf3fd" font-size="19">One command per gesture · Relax your thumb/finger before repeating</text><text x="560" y="540" fill="#b3c6db" font-size="16">P: pause/resume · Q: quit · Global: Ctrl+Alt+P / Ctrl+Alt+Q</text>
</g></svg>
